[project]
name = "spiderthrone"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "GabrielChavesM", email = "bielchavesmarques@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "beautifulsoup4>=4.12.3",
    "fastapi>=0.143.0",
    "fastembed>=0.9.0",
    "openai>=3.28.0",
    "playwright>=1.63.0",
    "pydantic>=1.7.4",
    "pypdf>=6.20.0",
    "python-dotenv>=1.2.4",
    "qdrant-client>=1.19.1",
    "requests>=2.27.1",
    "sentence-transformers>=6.1.0",
    "uvicorn>=0.54.0",
]

[project.scripts]
spiderthrone = "spiderthrone:main"

[build-system]
requires = ["uv_build>=0.13.0,<0.14.0"]
build-backend = "uv_build"
